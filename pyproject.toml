[project]
name = "luvlyai"
version = "0.1.0"
description = ""
authors = [
    {name = "'qbr0q'",email = "qbroq@vk.com"}
]
package-mode = false
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "pydantic-settings-yaml (>=0.2.0,<0.3.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "aiohttp-socks (>=0.11.0,<0.12.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Тяжелые ml-либы
[tool.poetry.group.ml.dependencies]
torch = { version = "2.11.0+cpu", source = "pytorch-cpu" }
sentence-transformers = ">=5.4.1"

# Все, что касается телеги и запросов бота
[tool.poetry.group.bots.dependencies]
aiogram = ">=3.27.0,<4.0.0"
openai = ">=2.33.0,<3.0.0"
aiohttp-socks = ">=0.11.0,<0.12.0"
redis = ">=5.0.0"

# Только для воркера и планировщика
[tool.poetry.group.tasks.dependencies]
taskiq = ">=0.12.4,<0.13.0"
taskiq-redis = ">=1.2.2,<2.0.0"
aiogram = ">=3.27.0,<4.0.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
